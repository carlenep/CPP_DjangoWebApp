<!DOCTYPE html>

<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration</h1>

    <p>
        <a href="{% url 'student_create' %}">Register Student</a>
    </p>

    <hr>

    <table border="1">
        <tr>
            <th>Student Name</th>
            <th>Program</th>
            <th>Year Level</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.student_name }}</td>
            <td>{{ student.program }}</td>
            <td>{{ student.year_level }}</td>
            <td>{{ student.email }}</td>
            <td>
                <a href="{% url 'student_update' student.pk %}">Edit</a>
                |
                <a href="{% url 'student_delete' student.pk %}">Delete</a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5">No students registered yet.</td>
        </tr>
        {% endfor %}

    </table>

    <!-- ADD THIS HERE -->
    <hr>

    <a href="{% url 'student_dashboard' %}">
        Student Dashboard
    </a>

</body>

</html>
